name: Stable Release

# Triggers manually via workflow_dispatch
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version tag (e.g., v0.0.1-stable). Leave empty to auto-increment from latest stable release.'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release title (defaults to Dybuk {version})'
        required: false
        type: string
        default: ''

jobs:
  test:
    name: Run Workspace Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Desktop Frontend
        shell: powershell
        run: |
          cd desktop
          npm install
          npm run build
          cd ..

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo test
        shell: powershell
        continue-on-error: true
        run: cargo test --workspace

  build:
    name: Build Windows Desktop Release Binary
    needs: test
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.bump.outputs.RELEASE_TAG }}
      release_title: ${{ steps.bump.outputs.RELEASE_TITLE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Query GitHub API to determine next stable tag matching pattern v0.*.*-stable.
      # If manual version input was provided, use that; otherwise auto-increment.
      - name: Determine stable version tag
        id: bump
        uses: actions/github-script@v7
        with:
          script: |
            const manualVersion = '${{ inputs.version }}'.trim();
            const manualTitle = '${{ inputs.release_title }}'.trim();

            let targetTag = manualVersion;

            if (!targetTag) {
              // Fetch up to 100 recent tags from GitHub API
              const { data: tags } = await github.rest.repos.listTags({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });

              // Filter for stable tags matching pattern v0.*.*-stable
              const stableRegex = /^v0\.\d+\.\d+-stable$/;
              const stableTags = tags
                .map(t => t.name)
                .filter(name => stableRegex.test(name));

              const parseStableVersion = (v) => {
                const match = v.match(/^v0\.(\d+)\.(\d+)-stable$/);
                if (!match) return [0, 0];
                return [parseInt(match[1], 10), parseInt(match[2], 10)];
              };

              // Sort tags descending
              stableTags.sort((a, b) => {
                const [minorA, patchA] = parseStableVersion(a);
                const [minorB, patchB] = parseStableVersion(b);
                if (minorA !== minorB) return minorB - minorA;
                return patchB - patchA;
              });

              // If no previous stable tags exist, start with v0.0.1-stable.
              // Otherwise increment the patch number.
              if (stableTags.length === 0) {
                targetTag = 'v0.0.1-stable';
              } else {
                const [minor, patch] = parseStableVersion(stableTags[0]);
                targetTag = `v0.${minor}.${patch + 1}-stable`;
              }
              console.log(`Latest stable tag found: ${stableTags[0] || 'none'}`);
            }

            const title = manualTitle || `Dybuk ${targetTag}`;

            console.log(`Resolved stable tag: ${targetTag}`);
            console.log(`Resolved release title: ${title}`);

            core.setOutput('RELEASE_TAG', targetTag);
            core.setOutput('RELEASE_TITLE', title);
            core.exportVariable('RELEASE_TAG', targetTag);

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Desktop Frontend
        shell: powershell
        run: |
          cd desktop
          npm install
          npm run build
          cd ..

      # Install stable Rust with MSVC target on Windows
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Cache cargo registry and target directory
      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # Build the production release binary for Desktop Tauri
      - name: Build Dybuk Desktop Binary
        run: |
          cargo build --release -p dybuk-desktop

      # Locate and package release binary
      - name: Locate and Package Release Binary
        shell: powershell
        run: |
          $tag = "${{ steps.bump.outputs.RELEASE_TAG }}"
          mkdir -p artifacts
          
          $bin = "target/release/dybuk-desktop.exe"
          if (-not (Test-Path $bin)) {
              $bin = "target/release/Dybuk.exe"
          }

          if (Test-Path $bin) {
              $dest = "artifacts/dybuk-desktop-$tag.exe"
              Copy-Item $bin $dest
              Write-Host "Packaged Desktop binary to $dest"
          } else {
              Write-Error "Dybuk binary not found at target/release!"
              exit 1
          }

      # Upload the packaged binaries for the release job
      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dybuk-stable-binaries
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Create GitHub Stable Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download the binaries compiled in the build job
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dybuk-stable-binaries
          path: dist

      # Delete any existing GitHub release and tag associated with this version if needed
      - name: Delete existing GitHub release and tag
        run: |
          gh release delete ${{ needs.build.outputs.release_tag }} --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Explicitly tag the current HEAD with the calculated stable version and push to remote
      - name: Create Git Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.build.outputs.release_tag }}
          git push origin ${{ needs.build.outputs.release_tag }}

      # Create stable release and upload binaries
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ${{ needs.build.outputs.release_title }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

