[package]
name = "dybuk"
version = "0.1.0"
description = "Core business logic and encryption engine for Dybuk"
authors = ["Luka Gray (aka Soumo Mukherjee)"]
edition = "2021"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
